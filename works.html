   <script>
    const yearButtons = document.querySelectorAll('.year-button');
    const yearGroups = document.querySelectorAll('.works-year-group');

    function showYear(year) {

        // 清除所有年份按鈕的 active
        yearButtons.forEach(button => {
            button.classList.remove('is-active');
        });

        // 清除所有作品群組的 active
        yearGroups.forEach(group => {
            group.classList.remove('is-active');
        });

        // 找到對應年份按鈕
        const activeButton = document.querySelector(
            `.year-button[data-year="${year}"]`
        );

        // 找到對應年份作品
        const activeGroup = document.querySelector(
            `.works-year-group[data-year="${year}"]`
        );

        // 如果年份存在，就顯示
        if (activeButton && activeGroup) {
            activeButton.classList.add('is-active');
            activeGroup.classList.add('is-active');
        }
    }


    // 點擊年份
    yearButtons.forEach(button => {

        button.addEventListener('click', () => {

            const selectedYear = button.dataset.year;

            showYear(selectedYear);

            // 把目前年份記錄在網址
            history.replaceState(
                null,
                '',
                `#${selectedYear}`
            );

        });

    });


    // 頁面載入時讀取網址中的年份
    const yearFromURL = window.location.hash.replace('#', '');

    if (
        yearFromURL &&
        document.querySelector(
            `.works-year-group[data-year="${yearFromURL}"]`
        )
    ) {

        showYear(yearFromURL);

    } else {

        // 沒有指定年份時預設 2026
        showYear('2026');

    }


    // 處理瀏覽器上一頁 / 下一頁
    window.addEventListener('hashchange', () => {

        const year = window.location.hash.replace('#', '');

        if (
            year &&
            document.querySelector(
                `.works-year-group[data-year="${year}"]`
            )
        ) {
            showYear(year);
        }

    });

</script>
